<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Fexty Leather Bags</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="layout/base :: header"></div>
<main class="container auth-form">
    <h2>Create Account</h2>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <form th:action="@{/register}" th:object="${user}" method="post">
        <input type="text" th:field="*{firstName}" placeholder="First Name" required>
        <input type="text" th:field="*{lastName}" placeholder="Last Name" required>
        <input type="text" th:field="*{mobile}" placeholder="Mobile" required>
        <input type="email" th:field="*{email}" placeholder="Email" required>
        <input type="password" th:field="*{password}" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>
</main>
</body>
</html>
