<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Product - Fexty Leather Bags</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="layout/base :: header"></div>
<main class="container auth-form">
    <h2>Admin - Add Product</h2>
    <p class="success" th:if="${success}" th:text="${success}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/admin/addpro}" th:object="${product}" method="post" enctype="multipart/form-data">
        <input type="text" th:field="*{name}" placeholder="Product Name" required>
        <textarea th:field="*{description}" placeholder="Description"></textarea>
        <input type="number" th:field="*{quantity}" placeholder="Quantity" min="0" value="0">
        <input type="number" th:field="*{price}" placeholder="Price" step="0.01" required>
        <select name="categoryId">
            <option value="">Select Category</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
        </select>
        <select th:field="*{status}">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select>
        <label><input type="checkbox" th:field="*{trending}"> Trending</label>
        <input type="file" name="imageFile" accept="image/*">
        <button type="submit">Add Product</button>
    </form>
</main>
</body>
</html>
